# PR checks: the Rust and ESLint gates prek runs locally (cargo fmt / clippy /
# test, eslint), plus frontend tsc and vitest, enforced on every PR and on
# pushes to main. After the checks pass on main, publish the server image to GHCR.
#
# Toolchains come from the actions (not the nix flake) to keep runners fast and
# the workflow self-contained. `cargo test --workspace` is sqlite-only (the
# Postgres backend has no tests that need a live DB), so no service container is
# required.
#
# Lint runs beside tests. The regular nextest suite and the opt-in WebRTC
# browser test share a build and run concurrently. Cargo runs doctests separately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run. Each main run has
  # its own group, so GitHub never replaces a pending main run either.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Must equal rust-toolchain.toml and the deploy/Dockerfile Rust image.
  # The rust-lint job fails when they differ.
  RUST_TOOLCHAIN: 1.96.0

jobs:
  release-commits:
    name: Conventional commits and version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects and workspace version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-release-commits.py "$BASE_SHA" "$HEAD_SHA" "$GITHUB_SHA"

  rust-lint:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check Rust toolchain matches local and production
        run: |
          toml="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          image="$(sed -n 's/^FROM rust:\([0-9][0-9.]*\)-.*/\1/p' deploy/Dockerfile)"
          if [ -z "$toml" ] || [ -z "$image" ]; then
            echo "::error::Cannot read the Rust version from rust-toolchain.toml or deploy/Dockerfile"
            exit 1
          fi
          if [ "$toml" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::CI uses Rust $RUST_TOOLCHAIN but rust-toolchain.toml uses $toml"
            exit 1
          fi
          case "$toml" in
            "$image" | "$image".*) ;;
            *)
              echo "::error::rust-toolchain.toml uses Rust $toml but deploy/Dockerfile uses rust:$image"
              exit 1
              ;;
          esac
          active="$(rustc --version)"
          case "$active" in
            "rustc $toml "*) echo "$active" ;;
            *)
              echo "::error::Active compiler is '$active', expected Rust $toml"
              exit 1
              ;;
          esac

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Reuse the existing Rust job's dependency cache in both jobs.
          shared-key: rust
          save-if: false

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust (test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          # PR code may restore a trusted cache, but only main publishes one.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
          fallback: none

      - name: Install Node for isolated native-agent fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Locate fixture runtime before tests isolate PATH
        run: |
          node="$(command -v node)"
          echo "CONVERSATIONS_TEST_NODE=$node" >> "$GITHUB_ENV"

      - name: Build the shared frontend the CLI embeds
        # The CLI bakes frontend/dist into the binary; the host's loopback
        # web UI lifecycle tests assert against that embedded build.
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Runner resources before Rust tests
        run: |
          printf 'Available processors: '
          nproc
          printf 'Online processors: '
          getconf _NPROCESSORS_ONLN
          free --mebi

      - name: Prepare private transport browser fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/private-transport" --ignore-scripts --no-audit --no-fund node-turn@0.0.6
          # A missing runtime fails here rather than exporting an empty path.
          node="$(command -v node)"
          chrome="$(command -v google-chrome)"
          {
            echo "PRIVATE_TRANSPORT_NODE=$node"
            echo "PRIVATE_TRANSPORT_CHROME=$chrome"
            echo "PRIVATE_TRANSPORT_NODE_MODULES=$RUNNER_TEMP/private-transport/node_modules"
          } >> "$GITHUB_ENV"

      - name: Build Rust test binaries
        run: cargo nextest run --locked --workspace --profile ci --no-run

      - name: Run Rust tests and WebRTC browser test
        run: |
          # Both invocations use the same workspace build. Buffer the browser
          # output so its evidence can be read separately from the regular suite.
          browser_log="$RUNNER_TEMP/private-transport-test.log"
          cargo nextest run --locked --workspace --profile ci --run-ignored only \
            --no-tests fail --no-capture -E 'binary(=private_files_terminal)' > "$browser_log" 2>&1 &
          browser_pid=$!

          suite_status=0
          /usr/bin/time --verbose cargo nextest run --locked --workspace --no-fail-fast --profile ci || suite_status=$?
          browser_status=0
          wait "$browser_pid" || browser_status=$?

          echo "::group::Private files and terminal over WebRTC"
          cat "$browser_log"
          echo "::endgroup::"
          test "$suite_status" -eq 0 && test "$browser_status" -eq 0

      - name: Rust doctests
        run: cargo test --locked --workspace --doc

      - name: Verify normal binaries for process fixtures
        run: |
          test -x target/debug/conversations
          test -x target/debug/conversations-server
          target/debug/conversations --version

      - name: Install uv
        timeout-minutes: 2
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: MCP thread identity and messaging
        timeout-minutes: 5
        run: |
          uv run scripts/test-codex-mcp-identity.py
          uv run scripts/test-agent-messaging-mcp.py
          uv run scripts/test-claude-channel-mcp.py

      - name: OpenCode bridge plugins
        timeout-minutes: 3
        run: |
          npm install --ignore-scripts --no-save --no-package-lock --prefix "$RUNNER_TEMP/solid" solid-js@1.9.18
          node --experimental-vm-modules crates/cli/src/commands/local_host/opencode_bridge/test.mjs \
            "$RUNNER_TEMP/solid/node_modules/solid-js/dist/solid.js"

  rust:
    # Preserve the original check name and fail if either parallel job did not pass.
    name: Rust (fmt, clippy, test)
    if: ${{ always() }}
    needs: [rust-lint, rust-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Rust checks
        env:
          LINT_RESULT: ${{ needs.rust-lint.result }}
          TEST_RESULT: ${{ needs.rust-test.result }}
        run: test "$LINT_RESULT" = success && test "$TEST_RESULT" = success

  frontend:
    name: Frontend (tsc, lint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx --no-install tsc -b

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

  image-build:
    name: Server image (${{ matrix.arch }})
    if: >-
      github.repository == 'SjuulArtreides/conversations' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, frontend]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sjuulartreides/conversations
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=server-image-${{ matrix.arch }},timeout=1m
          cache-to: type=gha,scope=server-image-${{ matrix.arch }},mode=max,timeout=1m,ignore-error=true

      - name: Push platform image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  image-publish:
    name: Publish server image
    needs: image-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/sjuulartreides/conversations
    steps:
      - name: Publish the multi-platform image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$tag" "$tag-amd64" "$tag-arm64"
          docker buildx imagetools inspect "$tag"
          printf 'Server image: %s\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
