# Pre-commit hooks for Conversations, run via prek (https://prek.j178.dev).
#   prek install          # install the git hook
#   prek run --all-files  # run every hook against the whole tree
#
# The Rust toolchain (cargo/clippy/rustfmt) and Node are provided by the flake
# dev shell (`direnv allow`); prek itself is on PATH.
repos:
  # --- Generic hygiene ---------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # --- Rust --------------------------------------------------------------
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy (-D warnings)
        entry: cargo clippy --locked --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test
        name: cargo test (workspace)
        entry: cargo test --locked --workspace
        language: system
        types: [rust]
        pass_filenames: false
        # Tests can be slow: only run on push, not on every commit.
        stages: [pre-push]

  # --- Frontend (React / Vite / TypeScript under frontend/) --------------
  # Run `npm ci` in frontend/ first. A missing install fails the hook.
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx --no-install eslint .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
