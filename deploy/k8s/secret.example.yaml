# Example Secret for Google SSO. Optional: without it, the server uses
# email+password login only.
# Copy to secret.yaml, fill in real values, and `kubectl apply` it (secret.yaml is gitignored).
# NEVER commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: google-oidc
  namespace: arrakis-conversations
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "your-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-client-secret"
---
# Example Secret for the OpenRouter LLM features (summary + chat). Only needed
# when you want those features enabled; the pod starts fine without it.
# The in-cluster env var MUST be OPENROUTER_API_KEY (OpenRouter's own name),
# regardless of what you call the value in a local .env file.
# Quicker than copying this file: create it imperatively (see deploy/DEPLOY.md):
#   kubectl create secret generic openrouter -n arrakis-conversations \
#     --from-literal=OPENROUTER_API_KEY=sk-or-v1-...
apiVersion: v1
kind: Secret
metadata:
  name: openrouter
  namespace: arrakis-conversations
type: Opaque
stringData:
  OPENROUTER_API_KEY: "sk-or-v1-..."
